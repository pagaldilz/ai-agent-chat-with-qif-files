# ---------------------------
# docker-compose.yml
# ---------------------------
services:
  qif-agent:
    build: .
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info
    volumes:
      - ./qifs:/qifs:ro    # QIF files mounted read-only
      - ./db:/db          # Database storage
      - ./docs/fund_pdfs:/docs/fund_pdfs:ro  # PDF files mounted read-only
    environment:
      - QIF_DIR=/qifs
      - DB_PATH=/db/transactions.db
      - FUND_PDF_DIR=/docs/fund_pdfs
      # LM Studio (default)
      - LLM_PROVIDER=lmstudio
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      # Optional: set model id from LM Studio /v1/models
      # - LLM_MODEL=unsloth/gpt-oss-20b
      # Ollama (optional; only used if LLM_PROVIDER=ollama)
      # - OLLAMA_URL=http://host.docker.internal:11434
      # OpenAI or Azure (optional):
      # - LLM_PROVIDER=openai
      # - OPENAI_API_KEY=sk-...
      # - LLM_MODEL=gpt-4o-mini
      # or for Azure OpenAI:
      # - LLM_PROVIDER=azure
      # - AZURE_OPENAI_ENDPOINT=https://your-resource-name.openai.azure.com
      # - AZURE_OPENAI_API_KEY=...
      # - AZURE_OPENAI_DEPLOYMENT=your-deployment
      # - AZURE_OPENAI_API_VERSION=2024-02-01
      # Optional tuning
      # - LLM_TEMPERATURE=0
    ports:
      - "8000:8000"
  qif-ui:
    ports:
      - "8501:8501"
    depends_on:
      - qif-agent
    volumes:
      - ./docs/fund_pdfs:/docs/fund_pdfs:ro  # PDF files mounted read-only
    environment:
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - QIF_API_URL=http://qif-agent:8000  # This env will be used in the Streamlit app
      - FUND_PDF_DIR=/docs/fund_pdfs  # Set the PDF directory path
    build:
       context: ./ui
       dockerfile: Dockerfile